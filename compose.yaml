name: pyxie-manager

# Only Caddy publishes ports (80/443). Everything else lives on the private
# `internal` network -- Postgres, Redis and the API are never reachable from
# the LAN. See docs/docker-caddy.md.

networks:
  internal:
    driver: bridge

volumes:
  pyxie_manager_db_data:
  pyxie_manager_redis_data:
  caddy_data:
  caddy_config:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# DB/Redis locations are derived here, so one .env serves both the native
# install (localhost URLs in .env) and this stack: `environment:` wins over
# `env_file:`. POSTGRES_PASSWORD must be URL-safe (letters/digits/._~-).
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pyxie-manager-db:5432/${POSTGRES_DB}
  REDIS_URL: redis://pyxie-manager-redis:6379/0

services:
  pyxie-manager-db:
    image: postgres:16-alpine
    container_name: pyxie-manager-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pyxie_manager_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pyxie-manager-redis:
    image: redis:7-alpine
    container_name: pyxie-manager-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pyxie_manager_redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pyxie-manager-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: pyxie-manager-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-env
      # The API has no published port; only web and worker can reach it, so
      # trusting X-Forwarded-For from the private network is safe. This is what
      # makes request.client (sessions, audit client_ip) the real browser IP.
      FORWARDED_ALLOW_IPS: "*"
      PYXIE_UPDATE_DIR: /update
    # The host updater (ops/docker/updater.py) writes release status here and picks up update requests.
    # Created by ops/docker/install-updater.sh so it is owned by the host user, not root. docs/updates.md
    volumes:
      - ${PYXIE_UPDATE_DIR:-./update}:/update
    networks:
      - internal
    depends_on:
      pyxie-manager-db:
        condition: service_healthy
      pyxie-manager-redis:
        condition: service_healthy

  pyxie-manager-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: pyxie-manager-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment: *app-env
    networks:
      - internal
    depends_on:
      pyxie-manager-api:
        condition: service_healthy
      pyxie-manager-redis:
        condition: service_healthy

  pyxie-manager-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: pyxie-manager-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://pyxie-manager-api:8000
      NODE_ENV: production
      # Next's standalone server.js binds to $HOSTNAME if set, and Docker
      # sets HOSTNAME to the container id. Force all interfaces so the
      # proxy (and the healthcheck) can reach it.
      HOSTNAME: "0.0.0.0"
    networks:
      - internal
    depends_on:
      pyxie-manager-api:
        condition: service_healthy

  pyxie-manager-caddy:
    image: caddy:2-alpine
    container_name: pyxie-manager-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PYXIE_HOSTNAME: ${PYXIE_HOSTNAME:?set PYXIE_HOSTNAME in .env}
      PYXIE_TLS_MODE: ${PYXIE_TLS_MODE:-internal}
      ACME_CA: ${ACME_CA:-}
    volumes:
      # Directory mounts, not single files: single-file bind mounts go stale
      # when the file is replaced (new inode), and reloads silently keep
      # serving the old config.
      - ./ops/caddy:/etc/caddy:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      pyxie-manager-web:
        condition: service_healthy
